<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo-full-light.png" />
    <title>Pre-orders — KI-VIX Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/loading.css" />
  </head>
  <body class="admin-body">
    <div class="admin-sidebar-overlay" data-admin-sidebar-overlay></div>
    <div class="admin-shell">
      <aside class="admin-sidebar" data-admin-sidebar>
        <div class="logo">
          <img
            src="/assets/logo-full-light.png"
            alt="KI-VIX"
            class="mark-img"
          />
          <span class="sub">ADMIN PANEL</span>
        </div>
        <nav class="admin-nav">
          <a href="/admin/index.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            Dashboard
          </a>
          <a href="/admin/products.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 8 12 3 3 8l9 5 9-5Z" />
              <path d="M3 8v8l9 5 9-5V8" />
              <path d="M12 13v8" />
            </svg>
            Products
          </a>
          <a href="/admin/orders.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1Z" />
              <path
                d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"
              />
              <path d="M9 12h6M9 16h6" />
            </svg>
            Orders
            <span class="admin-nav-badge" data-orders-nav-badge hidden>0</span>
          </a>
          <a href="/admin/preorders.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
            Pre-orders
            <span class="admin-nav-badge" data-preorders-nav-badge hidden>0</span>
          </a>
          <a href="/admin/reviews.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6L12 2z"
              />
            </svg>
            Reviews
          </a>
          <a href="/admin/homepage.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              <path d="M9 22V12h6v10" />
            </svg>
            Homepage
          </a>
          <a href="/admin/offers.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.59 13.41 13.41 20.59a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"
              />
              <circle cx="7" cy="7" r="1.5" />
            </svg>
            Offers
          </a>
          <a href="/admin/coupons.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"
              />
              <path d="M9 6v.01M9 12v.01M9 18v.01" stroke-linecap="round" />
            </svg>
            Coupons
          </a>
          <a href="/admin/admins.html" data-admin-nav>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Admins &amp; Mods
          </a>
        </nav>
        <div class="admin-sidebar-foot">
          <div class="admin-sidebar-user">
            <button
              type="button"
              class="admin-sidebar-avatar"
              data-admin-avatar-trigger
              title="Change profile photo"
            >
              <span data-admin-avatar></span>
            </button>
            <input
              type="file"
              accept="image/*"
              data-admin-avatar-input
              hidden
            />
            <div class="admin-sidebar-user-info">
              <div class="name" data-admin-name></div>
              <div class="role" data-admin-role></div>
            </div>
          </div>
          <button type="button" class="admin-logout-btn" data-admin-logout>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar-left">
            <button
              type="button"
              class="admin-sidebar-toggle"
              data-admin-sidebar-toggle
              aria-label="Open menu"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 12h18M3 6h18M3 18h18" />
              </svg>
            </button>
            <div>
              <h1>Pre-orders</h1>
              <div class="sub">Requests for items that are currently stock-out</div>
            </div>
          </div>
          <a
            href="/index.html"
            class="btn btn-secondary"
            style="padding: 9px 18px; font-size: 12.5px"
            target="_blank"
            rel="noopener"
            >View Store</a
          >
        </header>

        <div class="admin-content" data-admin-content>
          <div class="admin-panel">
            <div class="admin-panel-head">
              <h2>All Pre-orders (<span data-preorder-count>0</span>)</h2>
              <div style="display: flex; gap: 10px; flex-wrap: wrap">
                <input
                  type="text"
                  class="admin-search-input"
                  placeholder="Search by name, phone, product..."
                  data-preorder-search
                />
                <select
                  class="admin-role-select"
                  style="width: auto"
                  data-preorder-filter
                >
                  <option value="">All statuses</option>
                  <option value="Pending">Pending</option>
                  <option value="Contacted">Contacted</option>
                  <option value="Fulfilled">Fulfilled</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Pre-order</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody data-preorder-rows></tbody>
              </table>
              <div class="admin-empty" data-preorder-empty hidden>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 6v6l4 2" />
                </svg>
                No pre-orders found.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pre-order details modal -->
    <div class="cart-overlay" data-preorder-modal-overlay>
      <div class="admin-modal" role="dialog" aria-modal="true">
        <h3>Pre-order details</h3>
        <div data-preorder-modal-body></div>
        <div class="admin-modal-actions">
          <button
            type="button"
            class="btn btn-secondary"
            data-close-preorder-modal
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="/loading.js"></script>
    <script src="/data.js"></script>
    <script src="/cart.js"></script>
    <script src="/admin/admin-auth.js"></script>
    <script src="/admin/preorders.js"></script>
  </body>
</html>
